modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "GoldskinMC"
description = '''
Functional lighting for Create: searchlights, beacons and vehicle lights that keep working on contraptions, trains and Sable vehicles.
'''

[modproperties."${mod_id}"."yumi:entrypoints"]
"lambdynlights:initializer" = "com.goldskinmc.lightworks.compat.ldl.LightworksDynamicLights"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "${sable_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "lambdynlights"
type = "optional"
versionRange = "[4,)"
ordering = "NONE"
side = "CLIENT"
