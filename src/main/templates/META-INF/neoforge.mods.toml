modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Goldsk1n/CreateLightworks/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/create-lightworks"
authors = "GoldskinMC"
description = '''
Functional lights for Create that keep working on moving contraptions and vehicles.
'''

[[mixins]]
config = "lightworks.mixins.json"

[modproperties."${mod_id}"."yumi:entrypoints"]
"lambdynlights:initializer" = "com.goldskinmc.lightworks.compat.ldl.LightworksDynamicLights"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "${sable_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "lambdynlights"
type = "optional"
versionRange = "[4,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "sodiumdynamiclights"
type = "optional"
versionRange = "[1.0,)"
ordering = "NONE"
side = "CLIENT"
