modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "GoldskinMC"
description = '''
Functional lighting for Create: searchlights, floodlights, rotating beacons, warning lights, edge markers and vehicle lights (headlights, tail and brake lights) that keep landing where they point on contraptions, trains and Sable vehicles.

Optional: LambDynamicLights (moving lights light the world), Sable with Create Aeronautics.
'''

[[mixins]]
config = "lightworks.mixins.json"

[modproperties."${mod_id}"."yumi:entrypoints"]
"lambdynlights:initializer" = "com.goldskinmc.lightworks.compat.ldl.LightworksDynamicLights"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "${sable_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "lambdynlights"
type = "optional"
versionRange = "[4,)"
ordering = "NONE"
side = "CLIENT"
