plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    // Patterns are relative to each resource folder; datagen's cache sits at the top of src/generated/resources
    exclude('.cache/**')
}

// Dev runs load classes and resources from the build folders, so the self-test, the game tests and their structure
// templates stay out of the release jar and work as before in runClient and runGameTestServer
tasks.named('jar', Jar) {
    exclude('com/goldskinmc/lightworks/debug/selftest/**')
    exclude('com/goldskinmc/lightworks/gametest/**')
    exclude('data/lightworks/structure/**')
}

repositories {
    mavenCentral()
    // Create, Ponder, Flywheel
    maven { url = 'https://maven.createmod.net' }
    // Registrate
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    // LambDynamicLights
    maven { url = 'https://maven.gegy.dev' }
    // Veil (Sable's rendering library), dev runs only
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter {
            includeGroup 'foundry.veil'
            includeGroup 'gg.moonflower'
            includeGroup 'io.github.ocelot'
        }
    }
    // Modrinth's Maven: Sodium, Iris, spark and the test shader pack, dev runs only
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Sable and Sable Companion
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter {
            includeGroup 'dev.ryanhcode.sable'
            includeGroup 'dev.ryanhcode.sable-companion'
        }
    }
}

// Dev runtime profile, set with -Prun_profile=<name>:
//   latest (default) newest Create, Sable, Veil, LambDynamicLights and jars in ./libs
//   lite             newest Create only; boots faster when vehicles and dynamic light are not involved
//   floor            oldest supported stack: NeoForge 21.1.125 and Create 6.0.0, no Sable
def runProfile = providers.gradleProperty('run_profile').getOrElse('latest')
if (!(runProfile in ['latest', 'lite', 'floor'])) {
    throw new GradleException("Unknown run_profile '${runProfile}'; use latest, lite or floor")
}
def floorRun = runProfile == 'floor'
// Each profile keeps its own game directory, so worlds never load with mods they were not made with
def runDir = runProfile == 'latest' ? 'run' : "run-${runProfile}"
def quickPlayWorld = providers.gradleProperty('quickplay_world').getOrElse('lightworks-test')
// -Pquickplay_server=localhost joins that server instead of the test world (dedicated-server checks)
def quickPlayServer = providers.gradleProperty('quickplay_server').getOrNull()
// -Pdev_perf=true adds Sodium, Iris and spark for the shader and performance scenarios
def devPerf = providers.gradleProperty('dev_perf').map { it.toBoolean() }.getOrElse(false)
// -Pdev_ldl=false leaves LambDynamicLights out of `latest` runs: a player without the optional client mod
def devLdl = providers.gradleProperty('dev_ldl').map { it.toBoolean() }.getOrElse(true)
// -Pdev_sdl=true adds Sodium Dynamic Lights to `latest` runs instead, with -Pdev_ldl=false and -Pdev_perf=true (Sodium)
def devSdl = providers.gradleProperty('dev_sdl').map { it.toBoolean() }.getOrElse(false)
// -Pdev_tools=true adds JEI and The One Probe to `latest`/`lite` runs, for playing by hand: dev only, never shipped
def devTools = providers.gradleProperty('dev_tools').map { it.toBoolean() }.getOrElse(false)
// -Pdev_conflicts=contraption-lights,create-train-lights,create-dynamic-lights adds other lighting mods
// (with what they require) to `latest` runs for the S9 conflict test. create-dynamic-lights needs -Pdev_perf
// and -Pdev_ldl=false: LambDynamicLights refuses to load next to Sodium Dynamic Lights, which it requires.
def devConflicts = providers.gradleProperty('dev_conflicts').map { it.split(',')*.trim() as Set }.getOrElse([] as Set)

neoForge {
    version = floorRun ? project.neo_floor_version : project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            jvmArgument '-Xmx4G'
            // -Pselftest=true builds a test Searchlight on join and logs both light paths (debug/SelfTest)
            systemProperty 'lightworks.selftest', providers.gradleProperty('selftest').getOrElse('false')
            // -Pselftest_quit=true closes the game once the self-test is done (unattended runs)
            systemProperty 'lightworks.selftest.quit', providers.gradleProperty('selftest_quit').getOrElse('false')
            // -Pwindow=1920x1080 opens the game at that size (screenshots are taken at the window's size)
            def window = providers.gradleProperty('window').getOrNull()
            if (window != null) {
                def (width, height) = window.tokenize('x')
                programArguments.addAll '--width', width, '--height', height
            }
            // Join the test world straight from launch once it exists in this profile's saves
            if (quickPlayServer != null) {
                programArguments.addAll '--quickPlayMultiplayer', quickPlayServer
            } else if (file("${runDir}/saves/${quickPlayWorld}").exists()) {
                programArguments.addAll '--quickPlaySingleplayer', quickPlayWorld
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'lightworks.selftest', providers.gradleProperty('selftest').getOrElse('false')
            // With the self-test, -Pselftest_quit=true stops the server once it is done
            systemProperty 'lightworks.selftest.quit', providers.gradleProperty('selftest_quit').getOrElse('false')
        }
        // Headless load check: boots every mod, runs game tests, exits
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            // The dedicated server gets its own folder, so its log and world never clash with a client's
            gameDirectory = file(name == 'server' ? "${runDir}-server" : runDir)
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Present in dev runs, never published as a dependency
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def mappingsAttribute = Attribute.of('net.minecraft.mappings', String)

dependencies {
    attributesSchema {
        attribute(mappingsAttribute)
    }

    // Compile against the oldest versions we support, so newer-only API calls fail the build
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_floor_version}") { transitive = false }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_floor_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_floor_version}"
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_floor_version}"
    compileOnly "dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}"
    compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${ldl_version}") {
        attributes { attribute(mappingsAttribute, 'mojmap') }
    }
    compileOnly("maven.modrinth:sodium-dynamic-lights:${sodium_dynamic_lights_version}") { transitive = false }

    // Sable Companion: bundled with an open range; returns safe defaults when Sable is absent
    jarJar("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}") {
        version {
            strictly "[${sable_companion_floor_version},)"
            prefer sable_companion_floor_version
        }
    }

    if (floorRun) {
        // Create 6.0.0's full jar bundles its own Ponder, Flywheel and Registrate
        localRuntime("com.simibubi.create:create-${minecraft_version}:${create_floor_version}") { transitive = false }
        localRuntime "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_floor_version}"
    } else {
        localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
        localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
        localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"
        localRuntime "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    }

    if (runProfile == 'latest') {
        // Non-transitive: Sable's POM pulls the full Create jar, which would load Create twice
        localRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
        localRuntime "dev.ryanhcode.sable:sable-sable_rapier-${minecraft_version}:${sable_version}"
        localRuntime "foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}"

        if (devLdl) {
            localRuntime("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${ldl_version}") {
                attributes { attribute(mappingsAttribute, 'mojmap') }
            }
        }

        // Release jars dropped into ./libs (for example Create Aeronautics) load in dev runs
        localRuntime fileTree(dir: 'libs', include: '*.jar')
    }

    if (devPerf && !floorRun) {
        localRuntime("maven.modrinth:iris:${iris_version}") { transitive = false }
        localRuntime("maven.modrinth:spark:${spark_version}") { transitive = false }
    }

    if (devTools && !floorRun) {
        localRuntime("maven.modrinth:jei:${jei_version}") { transitive = false }
        localRuntime("maven.modrinth:the-one-probe:${the_one_probe_version}") { transitive = false }
    }

    if (runProfile == 'latest' && devSdl) {
        if (devLdl || !devPerf) {
            throw new GradleException('dev_sdl needs -Pdev_ldl=false (LambDynamicLights refuses it) and -Pdev_perf=true (Sodium)')
        }
        localRuntime("maven.modrinth:sodium-dynamic-lights:${sodium_dynamic_lights_version}") { transitive = false }
    }

    if (runProfile == 'latest') {
        def conflictMods = [
                'contraption-lights'   : ["maven.modrinth:contraption-lights:${contraption_lights_version}"],
                'create-train-lights'  : ["maven.modrinth:create-train-lights:${create_train_lights_version}",
                                          "maven.modrinth:architectury-api:${architectury_version}"],
                'create-dynamic-lights': ["maven.modrinth:create-dynamic-lights:${create_dynamic_lights_version}",
                                          "maven.modrinth:sodium-dynamic-lights:${sodium_dynamic_lights_version}",
                                          "maven.modrinth:sodium-options-api:${sodium_options_api_version}",
                                          "maven.modrinth:reeses-sodium-options:${reeses_sodium_options_version}"],
        ]
        if ('create-dynamic-lights' in devConflicts && (devLdl || !devPerf)) {
            throw new GradleException('create-dynamic-lights needs -Pdev_perf=true (Sodium) and -Pdev_ldl=false '
                    + '(LambDynamicLights refuses to load next to Sodium Dynamic Lights)')
        }
        devConflicts.each { name ->
            if (!conflictMods.containsKey(name)) {
                throw new GradleException("Unknown dev_conflicts mod '${name}'; use ${conflictMods.keySet().join(', ')}")
            }
            conflictMods[name].each { localRuntime(it) { transitive = false } }
        }
    }

    // Pure-logic and architecture tests: no game boot
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Puts Complementary Reimagined into this profile's shaderpacks folder (for scenario S5).
// Its licence allows personal use; it is never bundled or redistributed.
configurations {
    shaderpack
}
dependencies {
    shaderpack "maven.modrinth:complementary-reimagined:${shaderpack_version}@zip"
}
tasks.register('installShaderpack', Copy) {
    group = 'mod development'
    description = 'Installs the test shader pack into the current run profile'
    from configurations.shaderpack
    into "${runDir}/shaderpacks"
}

// Gradle-launched runs use JetBrains Runtime, which can hot-swap class changes including new methods
// and fields. Hot-swap loop: `./gradlew runClient --debug-jvm`, attach IntelliJ's debugger to port 5005,
// edit, then Build > Recompile (or Ctrl+Shift+F9) and accept "Reload changed classes".
// -Pdev_hotswap=false falls back to the normal toolchain JDK.
// (Class Data Sharing archives were tried and made boots 6-9x slower under NeoForge's class loaders.)
def devHotswap = providers.gradleProperty('dev_hotswap').map { it.toBoolean() }.getOrElse(true)
def jbrLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
    vendor = JvmVendorSpec.JETBRAINS
}
// Sodium's jar is a launcher service that loads the real mod from inside itself. That only works from a
// mods folder, not the dev classpath, so -Pdev_perf runs copy it into the profile's mods/ as dev-perf-*.jar.
// Other runs remove it again; any other file in mods/ is left alone.
configurations {
    devPerfMods
}
dependencies {
    devPerfMods("maven.modrinth:sodium:${sodium_version}") { transitive = false }
}
tasks.register('syncDevPerfMods') {
    // Not a Sync: with nothing to copy, a Sync is skipped as NO-SOURCE and never deletes the old jar
    def modsDir = file("${runDir}/mods")
    def jars = devPerf && !floorRun ? configurations.devPerfMods : files()
    inputs.files(jars)
    outputs.upToDateWhen { false }
    doLast {
        modsDir.mkdirs()
        modsDir.listFiles().findAll { it.name.startsWith('dev-perf-') }.each { it.delete() }
        jars.each { jar ->
            java.nio.file.Files.copy(jar.toPath(), new File(modsDir, "dev-perf-${jar.name}").toPath())
        }
    }
}

tasks.withType(JavaExec).configureEach {
    if (name.startsWith('run')) {
        dependsOn 'syncDevPerfMods'
    }
    if (devHotswap && name.startsWith('run')) {
        javaLauncher = jbrLauncher
        jvmArgs '-XX:+AllowEnhancedClassRedefinition'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            sable_version_range    : sable_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
