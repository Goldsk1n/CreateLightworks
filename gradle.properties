org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Version policy: compile against the oldest version we support ("floor"), run dev on the newest.
# Dev runtime profiles (-Prun_profile=...): latest (default), lite (Create only), floor (Create 6.0.0).
# Put run_profile=lite in ~/.gradle/gradle.properties to make it your personal default.

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Oldest NeoForge that can run Sable in dev; also what we compile against
neo_version=21.1.228
# What Create 6.0.0 requires; used by floor runs
neo_floor_version=21.1.125
neo_version_range=[21.1.125,)
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Create 6
create_version_range=[6.0.0,6.1.0)
# Floor: compiled against. 6.0.0 has no slim jar; its full jar bundles Ponder, Flywheel and Registrate
create_floor_version=6.0.0-4
flywheel_floor_version=1.0.0-9
registrate_floor_version=MC1.21-1.3.0+62
# Latest public release, used in dev runs (6.0.11 builds on the Maven are unreleased dev builds)
create_version=6.0.10-280
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
# Ponder's scene API is identical from 1.0.39 (bundled in Create 6.0.0) to 1.0.82
ponder_version=1.0.82

## Optional integrations
sable_version_range=[1.0.4,)
# Dev runtime
sable_version=2.0.6
veil_version=4.3.2
# Sable Companion: we bundle the floor with an open range, so NeoForge picks whatever Sable ships
# (Sable 1.1.x rejects Companion newer than 1.5.0; Sable 2.0.x ships 1.6.0)
sable_companion_floor_version=1.4.2
sable_companion_version=1.6.0
ldl_version=4.8.11+1.21.1

## Performance and shader tools for dev runs (-Pdev_perf=true; latest and lite profiles)
# Iris 1.8.14-beta.1 requires exactly this Sodium; Sable needs Sodium 0.8.12-alpha.2 or newer
sodium_version=mc1.21.1-0.8.13-neoforge
iris_version=1.8.14-beta.1+1.21.1-neoforge
spark_version=1.10.124-neoforge-1.21.1
# Installed into the profile's shaderpacks folder by ./gradlew installShaderpack
shaderpack_version=r5.9.3
# Other lighting mods for the S9 conflict test (-Pdev_conflicts=...), Modrinth Maven, dev runs only
contraption_lights_version=1.5.5
create_train_lights_version=1.2.0
architectury_version=13.0.11+neoforge
create_dynamic_lights_version=neoforge-2.0.1
sodium_dynamic_lights_version=neoforge-1.21.1-1.0.10
sodium_options_api_version=neoforge-1.21.1-1.0.10
reeses_sodium_options_version=mc1.21.1-2.2.4+neoforge

## Mod
# Working title; rename before the first public release
mod_id=lightworks
mod_name=Create: Lightworks
mod_license=MIT
mod_version=0.1.0-spike
mod_group_id=com.goldskinmc.lightworks
